<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0a0e1a;
      --bg-card:     #111827;
      --bg-row-alt:  #0f1520;
      --bg-applied:  #071a11;
      --border:      #1e2a3a;
      --border-lite: #243044;
      --indigo:      #6366f1;
      --indigo-dim:  rgba(99,102,241,0.12);
      --emerald:     #10b981;
      --emerald-dim: rgba(16,185,129,0.12);
      --text:        #e2e8f0;
      --text-muted:  #64748b;
      --text-dim:    #94a3b8;
      --amber:       #f59e0b;
      --red:         #ef4444;
      --radius:      8px;
      --mono:        'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.4px;
    }
    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--indigo);
      box-shadow: 0 0 8px var(--indigo);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .count-badge {
      background: var(--indigo-dim);
      color: var(--indigo);
      border: 1px solid rgba(99,102,241,0.25);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .applied-badge {
      background: var(--emerald-dim);
      color: var(--emerald);
      border: 1px solid rgba(16,185,129,0.25);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── Controls ── */
    .controls {
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      opacity: 0.4;
      pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-lite);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px 8px 36px;
      outline: none;
      transition: border-color .15s;
    }
    #search:focus { border-color: var(--indigo); }
    #search::placeholder { color: var(--text-muted); }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-lite);
      border-radius: var(--radius);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--indigo); color: var(--text); }
    .filter-btn.active { background: var(--indigo-dim); border-color: var(--indigo); color: var(--indigo); }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      padding: 0 32px 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      user-select: none;
    }

    thead th.sortable {
      cursor: pointer;
      transition: color .15s;
    }
    thead th.sortable:hover { color: var(--text); }
    thead th.sorted-asc::after  { content: ' ↑'; color: var(--indigo); }
    thead th.sorted-desc::after { content: ' ↓'; color: var(--indigo); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    tbody tr:nth-child(even) { background: var(--bg-row-alt); }
    tbody tr:hover { background: rgba(99,102,241,0.04); }
    tbody tr.is-applied {
      background: var(--bg-applied);
      opacity: 0.65;
    }
    tbody tr.hidden-row { display: none; }

    td {
      padding: 12px 14px;
      vertical-align: middle;
      color: var(--text-dim);
    }

    .td-company {
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
    }

    .td-title a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color .15s;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 320px;
    }
    .td-title a:hover { color: var(--indigo); }

    .td-location {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .td-date {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .td-applied {
      text-align: center;
    }

    /* custom checkbox */
    .checkbox-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border-radius: 5px;
      border: 2px solid var(--border-lite);
      cursor: pointer;
      transition: all .15s;
      background: transparent;
      position: relative;
    }
    .checkbox-wrap:hover { border-color: var(--emerald); }
    .checkbox-wrap.checked {
      background: var(--emerald);
      border-color: var(--emerald);
    }
    .checkbox-wrap.checked::after {
      content: '';
      position: absolute;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      display: none;
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty h3 { font-size: 16px; color: var(--text-dim); margin-bottom: 6px; }
    .empty p { font-size: 13px; }
    .empty code {
      background: var(--bg-card);
      border: 1px solid var(--border-lite);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: var(--mono);
      color: var(--amber);
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-lite);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      transform: translateY(80px);
      opacity: 0;
      transition: all .25s cubic-bezier(.16,1,.3,1);
      pointer-events: none;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast .t-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    #toast.ok .t-dot { background: var(--emerald); }
    #toast.err .t-dot { background: var(--red); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      Job Tracker
    </div>
    <div class="header-meta">
      <span id="total-badge" class="count-badge">0 jobs</span>
      <span id="applied-badge" class="applied-badge">0 applied</span>
      <span id="last-updated" style="font-size:12px;"></span>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls">
    <div class="search-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search by title, company, or location…" autocomplete="off">
    </div>
    <button class="filter-btn active" id="btn-all">All</button>
    <button class="filter-btn" id="btn-unapplied">Not Applied</button>
    <button class="filter-btn" id="btn-applied">Applied ✓</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="jobs-table">
      <thead>
        <tr>
          <th class="sortable" data-col="company">Company</th>
          <th class="sortable" data-col="title">Role</th>
          <th class="sortable" data-col="location">Location</th>
          <th class="sortable" data-col="date_found">Found</th>
          <th>Applied</th>
        </tr>
      </thead>
      <tbody id="jobs-body"></tbody>
    </table>
    <div class="empty" id="empty-state">
      <div class="empty-icon">📭</div>
      <h3>No jobs yet</h3>
      <p>Run <code>node job-finder.js</code> to fetch listings, then refresh this page.</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"><div class="t-dot"></div><span id="toast-msg"></span></div>

<script>
  // ── State ────────────────────────────────────────────────────
  let allJobs = [];
  let sortCol = 'date_found';
  let sortDir = 'desc';
  let activeFilter = 'all'; // 'all' | 'applied' | 'unapplied'

  // ── Fetch ────────────────────────────────────────────────────
  async function loadJobs() {
    try {
      const res = await fetch('/api/jobs');
      allJobs = await res.json();
      renderTable();
    } catch (e) {
      showToast('Could not connect to server', false);
    }
  }

  // ── Render ───────────────────────────────────────────────────
  function renderTable() {
    const query = document.getElementById('search').value.trim().toLowerCase();
    const tbody = document.getElementById('jobs-body');
    const empty = document.getElementById('empty-state');

    // Filter
    let jobs = allJobs.filter(j => {
      if (activeFilter === 'applied'   && !j.applied) return false;
      if (activeFilter === 'unapplied' && j.applied)  return false;
      if (!query) return true;
      return (
        (j.company  || '').toLowerCase().includes(query) ||
        (j.title    || '').toLowerCase().includes(query) ||
        (j.location || '').toLowerCase().includes(query)
      );
    });

    // Sort
    jobs.sort((a, b) => {
      let va = (a[sortCol] || '').toString().toLowerCase();
      let vb = (b[sortCol] || '').toString().toLowerCase();
      if (sortCol === 'date_found') { va = a.date_found || ''; vb = b.date_found || ''; }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    // Update counts
    const totalApplied = allJobs.filter(j => j.applied).length;
    document.getElementById('total-badge').textContent   = `${allJobs.length} job${allJobs.length !== 1 ? 's' : ''}`;
    document.getElementById('applied-badge').textContent = `${totalApplied} applied`;

    // Render rows
    tbody.innerHTML = '';
    jobs.forEach(job => {
      const tr = document.createElement('tr');
      if (job.applied) tr.classList.add('is-applied');

      const companyTd = `<td class="td-company">${esc(job.company || '—')}</td>`;
      const titleTd   = `<td class="td-title"><a href="${esc(job.link || '#')}" target="_blank" rel="noopener">${esc(job.title || '—')}</a></td>`;
      const locationTd = `<td class="td-location">${esc(job.location || '—')}</td>`;
      const dateTd    = `<td class="td-date">${esc(job.date_found || '—')}</td>`;

      const checkTd   = `<td class="td-applied">
        <div class="checkbox-wrap ${job.applied ? 'checked' : ''}" data-link="${esc(job.link || '')}" data-applied="${job.applied}"></div>
      </td>`;

      tr.innerHTML = companyTd + titleTd + locationTd + dateTd + checkTd;
      tbody.appendChild(tr);
    });

    // Empty state
    empty.style.display = (allJobs.length === 0) ? 'block' : 'none';

    // Re-attach checkbox listeners
    tbody.querySelectorAll('.checkbox-wrap').forEach(box => {
      box.addEventListener('click', handleCheckbox);
    });

    // Header sort indicators
    document.querySelectorAll('thead th.sortable').forEach(th => {
      th.classList.remove('sorted-asc', 'sorted-desc');
      if (th.dataset.col === sortCol) {
        th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      }
    });

    // Last updated
    document.getElementById('last-updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  }

  // ── Checkbox handler ─────────────────────────────────────────
  async function handleCheckbox(e) {
    const box   = e.currentTarget;
    const link  = box.dataset.link;
    const next  = box.dataset.applied !== 'true'; // toggle

    // Optimistic UI
    box.dataset.applied = String(next);
    next ? box.classList.add('checked') : box.classList.remove('checked');
    const row = box.closest('tr');
    next ? row.classList.add('is-applied') : row.classList.remove('is-applied');

    // Update in-memory state
    const job = allJobs.find(j => j.link === link);
    if (job) job.applied = next;

    // Persist
    try {
      const res = await fetch('/api/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link, applied: next })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      showToast(next ? 'Marked as applied ✓' : 'Marked as not applied', true);
    } catch (err) {
      showToast('Save failed — check server', false);
      // Revert on failure
      if (job) job.applied = !next;
      renderTable();
    }

    // Update badges without full re-render
    const totalApplied = allJobs.filter(j => j.applied).length;
    document.getElementById('applied-badge').textContent = `${totalApplied} applied`;
  }

  // ── Sorting ──────────────────────────────────────────────────
  document.querySelectorAll('thead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = col === 'date_found' ? 'desc' : 'asc';
      }
      renderTable();
    });
  });

  // ── Search ───────────────────────────────────────────────────
  let searchTimer;
  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderTable, 200);
  });

  // ── Filter buttons ───────────────────────────────────────────
  function setFilter(f) {
    activeFilter = f;
    document.getElementById('btn-all').classList.toggle('active', f === 'all');
    document.getElementById('btn-unapplied').classList.toggle('active', f === 'unapplied');
    document.getElementById('btn-applied').classList.toggle('active', f === 'applied');
    renderTable();
  }
  document.getElementById('btn-all').addEventListener('click', () => setFilter('all'));
  document.getElementById('btn-unapplied').addEventListener('click', () => setFilter('unapplied'));
  document.getElementById('btn-applied').addEventListener('click', () => setFilter('applied'));

  // ── Toast ────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, ok = true) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.remove('ok', 'err');
    toast.classList.add(ok ? 'ok' : 'err');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ── Helpers ──────────────────────────────────────────────────
  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ─────────────────────────────────────────────────────
  loadJobs();
</script>
</body>
</html>
